[package]
name = "smartkey-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "smartkey"
description = "Control CLI (`smartkey` / `smartkeyctl`) and maintainer corpus tools (`smartkey-dev`) for SmartKey"

[features]
default = ["bundled-en", "bundled-vi"]
bundled-en = ["smartkey-core/bundled-en"]
bundled-vi = ["smartkey-core/bundled-vi"]

[[bin]]
name = "smartkey"
path = "src/main.rs"

[[bin]]
name = "smartkey-dev"
path = "src/dev.rs"

[dependencies]
smartkey-core = { path = "../smartkey-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
ratatui = "0.30"
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
smartkey-tsf = { path = "../../adapters/windows-smartkey" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Time",
] }
