[package]
name = "smartkey-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "smartkeyctl"
description = "Control CLI (`smartkeyctl`) and maintainer corpus tools (`smartkey-dev`) for SmartKey"

[features]
default = ["bundled-en"]
bundled-en = ["smartkey-core/bundled-en"]

[[bin]]
name = "smartkeyctl"
path = "src/main.rs"

[[bin]]
name = "smartkey-dev"
path = "src/dev.rs"

[dependencies]
smartkey-core = { path = "../smartkey-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
