# SmartKey English Language Rules (migrated from Rust const tables)

capitalize_standalone_i = true

function_words = [
  "a", "an", "and", "are", "as", "at", "be", "but", "by", "can", "do", "for", "from", "had",
  "has", "have", "he", "her", "his", "if", "in", "into", "is", "it", "me", "my", "no", "not",
  "of", "on", "or", "our", "out", "she", "so", "than", "that", "the", "their", "them", "then",
  "there", "these", "they", "this", "to", "up", "us", "was", "we", "were", "what", "when",
  "where", "which", "who", "will", "with", "would", "you", "your",
]

[clitics]
suffixes = ["t", "s", "m", "d", "ll", "ve", "re"]
prefixes = []

[casing]
leading_apostrophes = [
  "'em", "'cause", "'til", "'90s", "'80s", "'70s", "'60s", "'round", "'n'", "'tis", "'twas",
]
abbreviations = [
  "e.g", "eg", "i.e", "ie", "etc", "vs", "mr", "mrs", "ms", "dr", "prof", "inc", "ltd", "jr",
  "sr", "st", "ave", "approx", "dept", "fig", "vol", "al", "jan", "feb", "mar", "apr", "jun",
  "jul", "aug", "sep", "sept", "oct", "nov", "dec",
]
exclusions = []

# Curated spoken/chat locative & grammar disambiguators
