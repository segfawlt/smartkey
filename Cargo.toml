[workspace]
resolver = "2"
members = [
    "crates/smartkey-core",
    "crates/smartkey-cli",
    "crates/smartkey-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/segfawlt/smartkey"

[workspace.dependencies]
fst = "0.4"
levenshtein_automata = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.22", features = ["serde"] }
proptest = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
