name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace Tests, Clippy, Addon & Corpus Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Fcitx5 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake pkg-config libfcitx5core-dev libfcitx5utils-dev zstd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify single-sourced versions
        run: ./scripts/check-versions.sh

      - name: Run Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust workspace test suite
        run: cargo test --workspace --locked

      - name: Build Fcitx5 addon & run ctest smoke test
        run: |
          cmake -S adapters/fcitx5-smartkey -B adapters/fcitx5-smartkey/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSMARTKEY_CARGO_FLAGS="--locked"
          cmake --build adapters/fcitx5-smartkey/build -j"$(nproc)"
          ctest --test-dir adapters/fcitx5-smartkey/build --output-on-failure

      - name: Run golden corpus evaluation gate (0% false positives)
        run: cargo run --release --locked -p smartkey-cli --bin smartkey-dev -- eval

  portable-debian12:
    name: Portable Bundle & GLIBC <= 2.36 Floor (Debian 12)
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - name: Install Debian 12 build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config libfcitx5core-dev libfcitx5utils-dev \
            curl ca-certificates git zstd binutils

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build portable bundle & verify SHA-256
        run: |
          ./scripts/package-portable.sh
          cd dist
          sha256sum -c ./*.tar.zst.sha256

      - name: Verify GLIBC symbol version floor (<= 2.36)
        run: |
          TMP_UNPACK="$(mktemp -d)"
          zstd -d -c dist/*.tar.zst | tar -xf - -C "$TMP_UNPACK"
          for bin in "$TMP_UNPACK"/*/bin/smartkey "$TMP_UNPACK"/*/lib/fcitx5/libsmartkey.so; do
            echo "Checking GLIBC symbols in $bin..."
            MAX_MINOR="$(objdump -T "$bin" | sed -n 's/.*GLIBC_2\.\([0-9][0-9]*\).*/\1/p' | sort -n | tail -n1)"
            echo "  Max GLIBC_2.${MAX_MINOR:-0}"
            if [ -n "$MAX_MINOR" ] && [ "$MAX_MINOR" -gt 36 ]; then
              echo "error: $bin requires GLIBC_2.$MAX_MINOR (> 2.36)" >&2
              exit 1
            fi
          done
          rm -rf "$TMP_UNPACK"

  aarch64-check:
    name: Cross-Compile Check (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Rust toolchain with aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cross-build smartkey-cli & smartkey-ffi for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-gnu -p smartkey-cli -p smartkey-ffi
